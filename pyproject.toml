[project]
name = "evo-lmm"
version = "0.1.0"
description = "Evolutionary random-effects linear mixed models backed by genotype representation graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grapp",
    "msprime>=1.4.2",
    "numpy>=2.0",
    "pygrgl",
    "scipy>=1.14",
    "seaborn>=0.13.2",
    "snakemake>=9.25.2",
    "tskit>=1.0.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# The Python distribution supplied by the grgl submodule is named ``pygrgl``.
# Keep it editable so changes to the checked-out submodule are used locally.
pygrgl = { path = "grgl", editable = true }
grapp = { path = "grapp", editable = true }

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pydata-sphinx-theme>=0.20.0",
    "pytest>=8.3",
    "ruff>=0.16.3",
    "sphinx>=9.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
